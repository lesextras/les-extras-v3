name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul run par ref : annule les précédents encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secrets factices : les tests n'ouvrent aucune connexion Postgres réelle
  # (PrismaService est remplacé par un mock in-memory). `prisma generate`
  # n'a besoin que d'une URL syntaxiquement valide.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  JWT_SECRET: ci-test-jwt-secret
  SESSION_SECRET: ci-test-session-secret
  JWT_EXPIRES_IN: 1h
  NEXT_PUBLIC_API_URL: http://localhost:3001/api

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @lesextras/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (api + web)
        run: pnpm test

      - name: Build
        run: pnpm build

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Non bloquant : signale les vulnérabilités connues sans casser le build.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: pnpm audit (prod deps)
        run: pnpm audit --prod --audit-level high
